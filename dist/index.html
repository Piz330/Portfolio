<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111312" />
    <meta name="description" content="Portfolio de modèles 3D par Piz." />
    <title>Piz — Portfolio</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23111312'/%3E%3Cpath d='M18 48V16h17c9 0 14 4 14 11 0 5-3 8-7 9 5 1 8 5 8 10v2H39v-4c0-4-2-6-7-6h-4v10H18Zm10-18h6c3 0 5-1 5-3.5S37 23 34 23h-6v7Z' fill='%2375e0c1'/%3E%3C/svg%3E" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');

      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; background: #111312; color: #f4f6f1; font-family: Manrope, Arial, sans-serif; }
      a { color: inherit; }
      .site { max-width: 1440px; margin: 0 auto; padding: 0 30px; }
      .topbar { height: 84px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2e2b; }
      .wordmark { font-size: 1.1rem; font-weight: 800; letter-spacing: -.05em; text-decoration: none; }
      .wordmark b { color: #75e0c1; font-weight: inherit; }
      .status { color: #bfc6c0; font: 0.7rem/1 DM Mono, monospace; letter-spacing: .04em; text-transform: uppercase; }
      .status::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #75e0c1; margin: 0 8px 1px 0; box-shadow: 0 0 15px #75e0c1; }
      .intro { padding: clamp(72px, 12vw, 170px) 0 54px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: end; }
      h1 { max-width: 850px; margin: 0; font-size: clamp(3.2rem, 9vw, 8.6rem); font-weight: 700; letter-spacing: -.075em; line-height: .89; }
      h1 em { font-style: normal; color: #75e0c1; }
      .intro-note { width: 200px; margin: 0 0 7px; color: #9aa39c; font-size: .86rem; line-height: 1.55; }
      .archive-head { border-top: 1px solid #2a2e2b; padding: 16px 0; display: flex; justify-content: space-between; color: #aeb6af; font: .7rem/1 DM Mono, monospace; text-transform: uppercase; letter-spacing: .05em; }
      .grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 16px; }
      .project { position: relative; min-height: 620px; overflow: hidden; background: #202322; text-decoration: none; }
      .project::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(10,12,11,0) 45%, rgba(10,12,11,.72) 100%); pointer-events: none; }
      .project img { width: 100%; height: 100%; position: absolute; object-fit: cover; object-position: center; filter: saturate(.88) contrast(1.04); transition: transform .7s cubic-bezier(.2,.8,.2,1), filter .4s ease; }
      .project.sword img { object-fit: contain; object-position: center; padding: 42px; }
      .project:hover img { transform: scale(1.035); filter: saturate(1.1) contrast(1.06); }
      .project-meta { position: absolute; z-index: 1; right: 25px; bottom: 24px; left: 25px; display: flex; justify-content: space-between; align-items: end; gap: 10px; }
      .project-title { margin: 0; font-size: clamp(1.5rem, 2.5vw, 2.4rem); letter-spacing: -.055em; }
      .project-type { color: #d5dbd5; font: .68rem/1.4 DM Mono, monospace; text-transform: uppercase; letter-spacing: .05em; }
      .arrow { display: grid; place-items: center; width: 40px; height: 40px; border: 1px solid rgba(244,246,241,.35); border-radius: 50%; font-size: 1.25rem; transition: background .25s ease, color .25s ease; }
      .project:hover .arrow { background: #75e0c1; border-color: #75e0c1; color: #111312; }
      footer { display: flex; justify-content: space-between; gap: 25px; padding: 26px 0 38px; color: #8e9890; font: .7rem/1.5 DM Mono, monospace; text-transform: uppercase; letter-spacing: .04em; }
      @media (max-width: 680px) { .site { padding: 0 17px; } .topbar { height: 68px; } .intro { display: block; padding: 88px 0 45px; } .intro-note { width: auto; margin: 25px 0 0; } .grid { grid-template-columns: 1fr; gap: 10px; } .project { min-height: 510px; } .project.sword { min-height: 470px; } .project.sword img { padding: 28px; } footer { flex-direction: column; gap: 5px; } }
    </style>
  </head>
  <body>
    <main class="site">
      <header class="topbar">
        <a class="wordmark" href="#top">PIZ<b>.</b></a>
        <span class="status">portfolio / 02</span>
      </header>
      <section class="intro" id="top" aria-labelledby="title">
        <h1 id="title">MODÈLES<br />EN <em>3D.</em></h1>
        <p class="intro-note">Une sélection de mes créations. De nouvelles pièces arrivent bientôt.</p>
      </section>
      <div class="archive-head"><span>Sélection</span><span>2026 — en cours</span></div>
      <section class="grid" aria-label="Galerie de modèles">
        <a class="project character" href="fang-yuan.png" target="_blank" aria-label="Ouvrir le modèle personnage">
          <img src="fang-yuan.png" alt="Modèle 3D d'un personnage aux cheveux noirs, portant un kimono vert sombre." />
          <div class="project-meta"><div><p class="project-type">Modèle 01</p><h2 class="project-title">Fang Yuan</h2></div><span class="arrow" aria-hidden="true">↗</span></div>
        </a>
        <a class="project sword" href="viego-sword.png" target="_blank" aria-label="Ouvrir le modèle épée">
          <img src="viego-sword.png" alt="Modèle 3D d'une épée fantaisie vert émeraude." />
          <div class="project-meta"><div><p class="project-type">Modèle 02</p><h2 class="project-title">Viego Sword</h2></div><span class="arrow" aria-hidden="true">↗</span></div>
        </a>
      </section>
      <footer><span>© Piz</span><span>More soon</span></footer>
    </main>
  </body>
</html>
